# Alembic. SCHEMA.md is the source of truth; migrations are generated to match it, never the
# other way round. §12 of that document sets the discipline: one logical change per migration,
# every migration has a tested downgrade, and no migration ever grants UPDATE or DELETE on
# audit_log or adjudications. tests/test_invariants.py greps for the last of those.

[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os
# Read from the environment so a password never lands in a file that gets committed.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
