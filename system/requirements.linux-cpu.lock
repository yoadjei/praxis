# The dependency set for the CONTAINER: linux, x86-64, CPython 3.14, CPU-only torch.
#
# requirements.lock is the other one. That file is compiled `--universal`, so it describes every
# platform at once and is the record of what the candidate's machine resolves. This file exists
# because `--universal` and `docker build` disagree about what "torch" means.
#
# On Windows, PyPI's default torch wheel is already the CPU build, so the universal lock installs
# nothing extra. On linux it is the CUDA build, and the universal lock carries nineteen nvidia-*,
# cuda-* and triton entries behind `sys_platform == 'linux'` markers to match. Building the image
# from it therefore downloads the whole CUDA stack - nvidia-cublas alone is 423 MB, measured -
# into a container that has no GPU, cannot use any of it, and is documented CPU-only by D10. The
# first build of this image was abandoned partway through nvidia-cublas for exactly that reason.
#
# So torch and torchvision here come from download.pytorch.org/whl/cpu and resolve to 2.13.0+cpu
# and 0.28.0+cpu. PEP 440 makes those satisfy the `==2.13.0` and `==0.28.0` pins in
# requirements.txt, so neither pin has moved and no version was silently changed - the same
# release is named, from the index that publishes it without CUDA.
#
# 114 packages against the universal lock's 134. The twenty absent are those nineteen and
# colorama, which is Windows-only; nothing is here that is not there.
#
# nvidia-ml-py survives on purpose: ultralytics depends on it unconditionally, and it is a pure
# Python library for asking a driver questions. It carries no CUDA binaries.
#
# Hashes are still enforced. Regenerate with the command recorded at the foot of this header,
# which asks uv for the linux resolution directly. Running uv inside a linux container, as this
# file's first version was built, produces the same set and is the fallback if a future uv drops
# `--python-platform`:
#
#   docker run --rm -v "$PWD/requirements.txt:/in/requirements.txt:ro" -v "$PWD:/out" \
#     python:3.14-slim-bookworm sh -c 'pip install -q uv && uv pip compile /in/requirements.txt \
#       --python-version 3.14 --generate-hashes \
#       --extra-index-url https://download.pytorch.org/whl/cpu \
#       --index-strategy unsafe-best-match -o /out/requirements.linux-cpu.lock'
#
# Unlike requirements.lock this one is not constrained to the installed versions. It cannot be:
# the environment those versions were measured in is Windows, and the point of this file is the
# resolution a different platform gets. What the two share is requirements.txt, and every pin in
# that file is identical in both.
#
# This file was autogenerated by uv via the following command:
#    uv pip compile requirements.txt --python-platform x86_64-unknown-linux-gnu --python-version 3.14 --generate-hashes --index-strategy unsafe-best-match -o requirements.linux-cpu.lock
